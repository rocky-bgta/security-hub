plugins {
    id 'base'
}

configure(subprojects) {
    version '1.0-SNAPSHOT'

    repositories {
        mavenCentral()
    }

    plugins.withId('java') {
        tasks.withType(JavaCompile).configureEach {
            options.encoding = 'UTF-8'
        }

        tasks.withType(Test).configureEach { Test testTask ->
            useJUnitPlatform()

            def testType = rootProject.hasProperty('testType')
                    ? rootProject.property('testType').toString()
                    : 'all'
            testTask.inputs.property('testType', testType)

            if (testType != 'all') {
                testTask.filter.failOnNoMatchingTests = false

                switch (testType) {
                    case 'unit':
                        testTask.exclude '**/integration/**'
                        testTask.exclude '**/functional/**'
                        testTask.exclude '**/*Controller*Test*'
                        break
                    case 'integration':
                        testTask.include '**/integration/**'
                        break
                    case 'functional':
                        testTask.include '**/functional/**'
                        testTask.include '**/*Controller*Test*'
                        break
                    default:
                        throw new GradleException("Unknown testType '${testType}'. Use unit, integration, or functional.")
                }
            }
        }
    }
}

def ciTestModules = [
        ':common:core',
        ':services:auth:core',
        ':services:billing:core',
        ':services:cms:core',
        ':services:notification:core',
        ':services:phishing:core',
        ':services:registration:core',
        ':services:universal:core',
        ':services:vps:core',
        ':services:breach-detection:core',
        ':services:gateway:service'
]

tasks.register('ciTest') {
    group = 'verification'
    description = 'Run tests for deployable modules (use -PtestType=unit|integration|functional)'
    dependsOn ciTestModules.collect { "${it}:test" }
}

