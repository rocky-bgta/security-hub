plugins {
    id 'java-library'
}

group   = 'com.aspire.asat.common'
version = '1.0.0'

java { toolchain { languageVersion = JavaLanguageVersion.of(17) } }
repositories { mavenCentral() }

dependencies {
    // Put APIs that others compile against under `api` (DTOs/interfaces)
    api project.rootProject.ext.libraries.core.validationApi

    // Internal-only
    implementation project.rootProject.ext.libraries.core.lombok
    annotationProcessor project.rootProject.ext.libraries.core.lombok

    implementation project.rootProject.ext.libraries.core.awsSdkS3
    implementation project.rootProject.ext.libraries.core.blobStorage
    implementation project.rootProject.ext.libraries.core.gcpStorage
    implementation project.rootProject.ext.libraries.core.starterValidation
    testImplementation platform('org.junit:junit-bom:5.9.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    implementation("com.openhtmltopdf:openhtmltopdf-pdfbox:1.0.10")
    implementation("org.jsoup:jsoup:1.22.1")
}

test { useJUnitPlatform() }
