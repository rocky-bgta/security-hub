  asat-gateway-service:
    #    build:
    #      context: .
    #      dockerfile: services/gateway/service/Dockerfile
    image: ${ECR_REGISTRY}/aspire-gateway-asatv2:${TAG}
    container_name: gateway-service
    restart: unless-stopped
    ports:
      - "7030:7030"
    environment:
      SPRING_PROFILES_ACTIVE: ${ENVIRONMENT:-local}
      SERVER_PORT: 7030
      REDIS_HOST: ${REDIS_HOST:-asat-redis}
      MONGODB_URI: mongodb://user:password@asat-mongodb:27017/?authSource=admin
    networks:
      - asat_network
    depends_on:
      - redis
      - asat-auth-service
      - asat-billing-service
      # - cloud-config-service
      - asat-cms-service
      # - course-service
      - asat-notification-service
      - asat-phishing-service
      - asat-registration-service
      - asat-breach-detection-service
      # - sesame-service
      - asat-universal-service
      - asat-vps-service

networks:
  asat_network:
    external: true
