version: '3.9'

services:
  mongodb:
    image: mongo:7.0
    container_name: asat-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: user
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: test
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - asat-network
    command: mongod --auth

  redis:
    image: redis:7.2-alpine
    container_name: asat-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - asat-network
    command: redis-server --appendonly yes

networks:
  asat-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  redis_data:
    driver: local

