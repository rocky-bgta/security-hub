worker_processes auto;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    proxy_connect_timeout 120s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
    send_timeout 120s;

    # -------------------------------------------------------------------------
    # Landing page server (15.204.246.8) — campaign tracking domains
    #
    # Deploy this file on the landing host (NOT platform nginx-proxy).
    # Typical compose volume: ./nginx.conf:/etc/nginx/nginx.conf:ro
    #
    # Route by URL path prefix:
    #   Dev:        /dev/gateway/phishing/...
    #   Staging:    /staging/gateway/phishing/...
    #   Production: /gateway/phishing/...
    #
    # SMS short links are root paths: https://{domain}/{10-char} (01/10/11 + 8 random)
    # They MUST rewrite onto the env-prefixed phishing proxy (see below).
    # -------------------------------------------------------------------------

    server {
        listen 80;
        server_name
            account-storagealert.cloud
            alertsnotification.cloud
            confidential-docaccess.online
            customerfinancialservices.online
            employee-self-service.info
            governmentnotices.online
            health-benefitsupdate.icu
            invites-meeting.online
            learning-accessportal.tech
            mailboxquota.cloud
            microsofltonline.info
            notificationssupport.info
            official-noticecenter.info
            online-banking.tech
            passwords-notification.info
            patient-careaccess.com
            patient-careaccess.info
            patient-careaccess.online
            patient-careaccess.store;

        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;

        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name
            account-storagealert.cloud
            alertsnotification.cloud
            confidential-docaccess.online
            customerfinancialservices.online
            employee-self-service.info
            governmentnotices.online
            health-benefitsupdate.icu
            invites-meeting.online
            learning-accessportal.tech
            mailboxquota.cloud
            microsofltonline.info
            notificationssupport.info
            official-noticecenter.info
            online-banking.tech
            passwords-notification.info
            patient-careaccess.com
            patient-careaccess.info
            patient-careaccess.online
            patient-careaccess.store;

        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;

        ssl_certificate /etc/letsencrypt/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # ---------------------------------------------------------------------
        # SMS short links — one landing nginx, three envs
        #
        # 10-char codes: first 2 digits encode env, remaining 8 are random.
        #   Dev:     https://{domain}/01########  → /dev/gateway/phishing/t/s/{code}
        #   Staging: https://{domain}/10########  → /staging/gateway/phishing/t/s/{code}
        #   Prod:    https://{domain}/11########  → /gateway/phishing/t/s/{code}
        #
        # Pass the FULL 10-char code to phishing (do not strip the prefix).
        # $1 must be captured by the rewrite pattern (not the location regex alone).
        # ---------------------------------------------------------------------
        location ~ "^/(01[A-Za-z0-9]{8})$" {
            rewrite "^/(01[A-Za-z0-9]{8})$" /dev/gateway/phishing/t/s/$1 last;
        }

        location ~ "^/(10[A-Za-z0-9]{8})$" {
            rewrite "^/(10[A-Za-z0-9]{8})$" /staging/gateway/phishing/t/s/$1 last;
        }

        location ~ "^/(11[A-Za-z0-9]{8})$" {
            rewrite "^/(11[A-Za-z0-9]{8})$" /gateway/phishing/t/s/$1 last;
        }

        # Dev ASAT — 15.204.211.185
        location /dev/gateway/phishing/ {
            proxy_pass https://15.204.211.185/gateway/phishing/;
            proxy_http_version 1.1;
            proxy_set_header Host dev.aspireelearning.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-ASAT-Environment dev;
            proxy_ssl_server_name on;
            proxy_ssl_name dev.aspireelearning.com;
        }

        # Staging ASAT — 51.79.67.126
        location /staging/gateway/phishing/ {
            proxy_pass https://51.79.67.126/gateway/phishing/;
            proxy_http_version 1.1;
            proxy_set_header Host staging.aspireelearning.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-ASAT-Environment staging;
            proxy_ssl_server_name on;
            proxy_ssl_name staging.aspireelearning.com;
        }

        # Production ASAT — 15.204.234.241 (no path prefix)
        location /gateway/phishing/ {
            proxy_pass https://15.204.234.241/gateway/phishing/;
            proxy_http_version 1.1;
            proxy_set_header Host portal.securityawarenesstraining.ai;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-ASAT-Environment production;
            proxy_ssl_server_name on;
            proxy_ssl_name portal.securityawarenesstraining.ai;
        }

        location / {
            default_type text/plain;
            return 404;
        }
    }
}
