        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRiskProfileSaveRequest'
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseDtoUserRiskSummary'

  /api/v1/phishing/training-risk-score/{userId}:
    post:
      tags: [Training Risk Score]
      operationId: updateTrainingRiskScore
      summary: Update training risk score after microcontent completion
      parameters:
        - $ref: '#/components/parameters/userId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrainingRiskScoreRequest'
      responses:
        '200':
          description: Updated overall risk score
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseDtoDouble'

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Standard admin/UI authentication
    voiceIngestionApiKey:
      type: apiKey
      in: header
      name: X-Voice-Ingestion-Key
      description: Required when voice.ingestion.api-key is configured in application.yml

  parameters:
    campaignId:
      name: campaignId
      in: path
      required: true
      schema:
        type: string
    scenarioId:
      name: id
      in: path
      required: true
      schema:
        type: string
    attackTemplateId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Vishing attack template ID
    voiceServerId:
      name: id
      in: path
      required: true
      schema:
        type: string
    trackingId:
      name: trackingId
      in: path
      required: true
      schema:
        type: string
    videoId:
      name: videoId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    audioId:
      name: audioId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    userRiskProfileId:
      name: id
      in: path
      required: true
      schema:
        type: string
    userId:
      name: userId
      in: path
      required: true
      schema:
        type: string
    offset:
      name: offset
      in: query
      schema:
        type: integer
        default: 0
        minimum: 0
    pageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        default: 10
        minimum: 1
    searchParam:
      name: searchParam
      in: query
      schema:
        type: string

  responses:
    BadRequest:
      description: Validation error
    NotFound:
      description: Resource not found

  schemas:

    # --- Enums ---
    CampaignChannel:
      type: string
      enum: [EMAIL, SMS, VOICE]

    CampaignType:
      type: string
      enum:
        - VISHING_SIMULATION
        - VISHING_WITH_TRAINING

    CampaignStatus:
      type: string
      enum: [DRAFT, SCHEDULED, RUNNING, PAUSED, COMPLETED, CANCELLED, EXPIRED]

    VoiceResponseStage:
      type: string
      enum: [CALL_ENGAGED, COMPROMISED]

    LearningMode:
      type: string
      enum: [MICRO_CONTENT]

    VoiceCloneProvider:
      type: string
      enum: [ELEVENLABS, FISH_AUDIO]

    VoiceProviderType:
      type: string
      enum: [TWILIO, GENERIC_SIP]

    VoiceServerStatus:
      type: string
      enum: [ACTIVE, INACTIVE]

    VishingScenarioStatus:
      type: string
      enum: [DRAFT, PUBLISHED]

    LlmEscalationLimit:
      type: string
      enum: [LOW, MEDIUM, HIGH]

    VishingCallOutcome:
      type: string
      enum:
        - ANSWERED
        - ENGAGED
        - COMPROMISED
        - NO_ANSWER
        - FAILED
        - ANSWERED_BUT_REPORTED
        - REPORTED_WITHOUT_ANSWER
      description: |
        Scoring tiers (PhishingRiskScore):
        ANSWERED=20, ENGAGED=75, COMPROMISED=100,
        ANSWERED_BUT_REPORTED=10, others=0.

    RecipientStatus:
      type: string
      description: Voice-relevant recipient statuses
      enum:
        - PENDING
        - CALL_QUEUED
        - CALL_RINGING
        - ANSWERED
        - VOICE_ENGAGED
        - COMPROMISED
        - NO_ANSWER
        - CALL_FAILED
        - REPORTED

    # --- Request bodies ---
    CampaignCreateRequest:
      type: object
      required: [campaignName, campaignType, channel]
      properties:
        campaignName:
          type: string
        campaignType:
          $ref: '#/components/schemas/CampaignType'
        channel:
          type: string
          enum: [VOICE]
        assignedFor:
          type: string
          description: Ignored for VOICE; use responseStages instead
        responseStages:
          type: array
          items:
            $ref: '#/components/schemas/VoiceResponseStage'
        learningMode:
          $ref: '#/components/schemas/LearningMode'
        expireDate:
          type: string
          format: date

    CampaignVoiceSetupRequest:
      type: object
      required: [consentConfirmed]
      properties:
        consentConfirmed:
          type: boolean
        consentText:
          type: string
        callerId:
          type: string
          description: E.164 outbound number; optional if set on voice server config

    CampaignScenarioRequest:
      type: object
      required: [scenarioId]
      properties:
        scenarioId:
          type: string
        enableLlmResponses:
          type: boolean
        escalationLimit:
          $ref: '#/components/schemas/LlmEscalationLimit'

    CampaignTelephonyRequest:
      type: object
      required: [voiceServerConfigurationId]
      properties:
        voiceServerConfigurationId:
          type: string
        region:
          type: string
        countryCode:
          type: string
        retryPolicy:
          type: object
          properties:
            maxRetries:
              type: integer
              default: 3
            intervalMinutes:
              type: integer
              default: 15

    CampaignTagsRequest:
      type: object
      properties:
        tags:
          type: array
          items:
            type: string

    CampaignAudienceRequest:
      type: object
      properties:
        audienceType:
          type: string
        departmentIds:
          type: array
          items:
            type: string
        groupIds:
          type: array
          items:
            type: string
        userIds:
          type: array
          items:
            type: string
        riskGroups:
          type: array
          items:
            type: string

    CampaignTrainingRequest:
      type: object
      properties:
        trainingModuleId:
          type: string
        name:
          type: string
        productId:
          type: string
        packageId:
          type: string
        productPackageId:
          type: string
        assignedFor:
          type: string
        completionDays:
          type: object
          properties:
            durationUnit:
              type: string
            durationValue:
              type: integer

    CampaignScheduleRequest:
      type: object
      properties:
        scheduleType:
          type: string
        scheduledAt:
          type: string
          format: date-time
        timezone:
          type: string
        sendingConfig:
          type: object

    VoiceServerConfigurationRequest:
      type: object
      required: [name, provider]
      properties:
        name:
          type: string
          maxLength: 100
        provider:
          $ref: '#/components/schemas/VoiceProviderType'
        apiKey:
          type: string
        apiSecret:
          type: string
        callerId:
          type: string
        baseUrl:
          type: string
        region:
          type: string
        countryCode:
          type: string
        isDefault:
          type: boolean
          default: false
        status:
          $ref: '#/components/schemas/VoiceServerStatus'
        providerMetadata:
          type: object
          additionalProperties:
            type: string

    VoiceServerTestRequest:
      type: object
      required: [phoneNumber]
      properties:
        phoneNumber:
          type: string
          description: E.164 format

    VishingScenarioCreateRequest:
      type: object
      required: [scenarioName, scriptBody]
      properties:
        scenarioName:
          type: string
          maxLength: 150
        description:
          type: string
        attackTemplateId:
          type: string
        attackTemplateName:
          type: string
        language:
          type: string
        tone:
          type: string
        role:
          type: string
        scriptBody:
          type: string
        enableLlmResponses:
          type: boolean
          default: true
        escalationLimit:
          $ref: '#/components/schemas/LlmEscalationLimit'
        isGlobal:
          type: boolean
          default: false

    VishingAttackTemplateCreateRequest:
      type: object
      required: [name, script]
      properties:
        name:
          type: string
          maxLength: 150
          example: Bank Fraud Alert
        script:
          type: string
          example: "Hello {{FIRST_NAME}}, this is your bank calling."

    VishingAttackTemplateUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/VishingAttackTemplateCreateRequest'

    VishingAttackTemplateDto:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        script:
          type: string
        variables:
          type: array
          items:
            type: string
          example: ["{{FIRST_NAME}}"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    VishingScenarioUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/VishingScenarioCreateRequest'

    VoiceCallStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/RecipientStatus'
        startedAt:
          type: string
          format: date-time
        retries:
          type: integer

    VoiceCallResultRequest:
      type: object
      required: [outcome]
      properties:
        outcome:
          $ref: '#/components/schemas/VishingCallOutcome'
        durationSeconds:
          type: integer
        retries:
          type: integer
        recordingS3Key:
          type: string
        transcript:
          type: string
        audioId:
          type: string
        detectedKeywords:
          type: array
          items:
            type: string
        sensitiveDataCaptured:
          type: object
          additionalProperties: true
        sttLatencyMs:
          type: number
          format: double
        llmLatencyMs:
          type: number
          format: double
        ttsLatencyMs:
          type: number
          format: double
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time

    SuccessKeywordsRequest:
      type: object
      properties:
        keywords:
          type: array
          items:
            type: string

    TeachableMomentRequest:
      type: object
      required: [recipientId]
      properties:
        recipientId:
          type: string
        message:
