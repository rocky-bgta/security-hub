            text/csv:
              schema:
                type: string
                format: binary

  /api/v1/phishing/user-risk-profiles/{id}:
    get:
      tags: [User Risk Profile]
      operationId: getUserRiskProfile
      summary: Get user risk profile by ID
      parameters:
        - $ref: '#/components/parameters/userRiskProfileId'
      responses:
        '200':
          description: Risk profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseDtoUserRiskSummary'
