          application/json:
            schema:
              $ref: '#/components/schemas/UserRiskProfileSaveRequest'
      responses:
        '200':
          description: Profile saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseDtoUserRiskSummary'

  /api/v1/phishing/user-risk-profiles/export:
    get:
      tags: [User Risk Profile]
      operationId: exportUserRiskProfilesCsv
      summary: Export user risk profiles as CSV
      parameters:
        - name: clientAdminId
          in: query
