worker_processes auto;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    # Use Docker's internal DNS resolver
    resolver 127.0.0.11 valid=30s;

    # Preserve campaign domain when proxied from landing-page server (15.204.246.8)
    map $http_x_forwarded_host $gateway_forwarded_host {
        default $http_x_forwarded_host;
        ""      $host;
    }
    
    # Global proxy timeouts (prevents default 60s 504s)
    proxy_connect_timeout 120s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
    send_timeout 120s;

    # Redirect all HTTP traffic to HTTPS
    server {
        listen 80;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        server_name dev.aspireelearning.com;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        server_name dev.aspireelearning.com;

        # SSL Certificates (from letsencrypt folder)
        ssl_certificate /etc/letsencrypt/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/privkey.pem;

        # SSL Parameters
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;


        # PLATFORM only (server_name e.g. dev.aspireelearning.com). Do not copy to landing.
        # 10-char env-prefixed codes (01/10/11 + 8). Capture groups must be on the rewrite pattern.
        location ~ "^/((?:01|10|11)[A-Za-z0-9]{8})$" {
            rewrite "^/((?:01|10|11)[A-Za-z0-9]{8})$" /gateway/phishing/t/s/$1 last;
        }

        location ~ "^/dev/gateway/phishing/t/s/((?:01|10|11)[A-Za-z0-9]{8})$" {
            rewrite "^/dev/gateway/phishing/t/s/((?:01|10|11)[A-Za-z0-9]{8})$" /gateway/phishing/t/s/$1 last;
        }


        # Forward all traffic to the host module
        location / {
            set $host_upstream host:5000;
            proxy_pass http://$host_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Forward all traffic to the home module
        location /home-module/ {
            set $home_upstream home:5010;
            rewrite ^/home-module/(.*) /$1 break;
            proxy_pass http://$home_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Forward all traffic to the user module
        location /user-module/ {
            set $user_upstream user:5020;
            rewrite ^/user-module/(.*) /$1 break;
            proxy_pass http://$user_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Forward all traffic to the content module
        location /content-module/ {
            set $content_upstream content:5030;
            rewrite ^/content-module/(.*) /$1 break;
            proxy_pass http://$content_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Forward all traffic to the billing module
        location /billing-module/ {
            set $billing_upstream billing:5050;
            rewrite ^/billing-module/(.*) /$1 break;
            proxy_pass http://$billing_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Forward all traffic to the account module
        location /account-module/ {
            set $account_upstream account:5090;
            rewrite ^/account-module/(.*) /$1 break;
            proxy_pass http://$account_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Forward all traffic to the miscellaneous module
        location /miscellaneous-module/ {
            set $miscellaneous_upstream miscellaneous:5040;
            rewrite ^/miscellaneous-module/(.*) /$1 break;
            proxy_pass http://$miscellaneous_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /phishing-module/ {
            set $phishing_upstream phishing:5070;
            rewrite ^/phishing-module/(.*) /$1 break;
            proxy_pass http://$phishing_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }



        # =====================================================================
        # BACKEND GATEWAY - General route for all /gateway/* requests
        # This must come AFTER the specific swagger routes above
        # =====================================================================
        
        location /gateway/ {
    set $gateway_upstream asat-gateway-service:7030;
    rewrite ^(.*)$ $1 break;
    proxy_pass http://$gateway_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $gateway_forwarded_host;
}

        # =====================================================================
        # SWAGGER UI ROUTES
        # These routes handle Swagger UI access through the gateway
        # Access at: https://dev.aspireelearning.com/gateway/swagger-ui.html
        # =====================================================================

        # Gateway's own Swagger UI - strip /gateway prefix
        location = /gateway/swagger-ui.html {
            set $gateway_upstream asat-gateway-service:7030;
            proxy_pass http://$gateway_upstream/swagger-ui.html;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Gateway Swagger UI static assets
        location /gateway/swagger-ui/ {
            set $gateway_upstream asat-gateway-service:7030;
            proxy_pass http://$gateway_upstream/swagger-ui/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Gateway API docs (gateway's own OpenAPI spec)
        location = /gateway/v3/api-docs {
            set $gateway_upstream asat-gateway-service:7030;
            proxy_pass http://$gateway_upstream/v3/api-docs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Gateway webjars (Swagger UI dependencies)
        location /gateway/webjars/ {
            set $gateway_upstream asat-gateway-service:7030;
            proxy_pass http://$gateway_upstream/webjars/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # =====================================================================
        # FALLBACK ROUTES FOR SWAGGER
        # These handle requests from Swagger UI that use relative paths
        # without the /gateway prefix
        # =====================================================================

        # Redirect root swagger-ui.html to gateway swagger
        location = /swagger-ui.html {
            return 302 /gateway/swagger-ui.html;
        }

        # Handle swagger-ui static assets (fallback for relative paths)
        location /swagger-ui/ {
            set $gateway_upstream asat-gateway-service:7030;
            proxy_pass http://$gateway_upstream/swagger-ui/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Handle webjars (fallback for relative paths)
        location /webjars/ {
            set $gateway_upstream asat-gateway-service:7030;
            proxy_pass http://$gateway_upstream/webjars/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Handle /v3/api-docs (fallback for relative paths)
        location /v3/api-docs {
            set $gateway_upstream asat-gateway-service:7030;
            proxy_pass http://$gateway_upstream/v3/api-docs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # =====================================================================
# MICROSERVICE SWAGGER FALLBACK ROUTES
# These handle API and Swagger requests from individual service Swagger UIs
# Using regex to avoid catching frontend routes like /auth/login
# =====================================================================

# Auth service API and Swagger paths only
location ~ ^/auth/(v3/api-docs|swagger-ui|api/) {
    set $gateway_upstream asat-gateway-service:7030;
    rewrite ^/auth/(.*)$ /gateway/auth/$1 break;
    proxy_pass http://$gateway_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# CMS service paths
location ~ ^/cms/(v3/api-docs|swagger-ui|api/) {
    set $gateway_upstream asat-gateway-service:7030;
    rewrite ^/cms/(.*)$ /gateway/cms/$1 break;
    proxy_pass http://$gateway_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Registration service paths
location ~ ^/registration/(v3/api-docs|swagger-ui|api/) {
    set $gateway_upstream asat-gateway-service:7030;
    rewrite ^/registration/(.*)$ /gateway/registration/$1 break;
    proxy_pass http://$gateway_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Billing service paths (backend API only, not billing-module)
location ~ ^/billing/(v3/api-docs|swagger-ui|api/) {
    set $gateway_upstream asat-gateway-service:7030;
    rewrite ^/billing/(.*)$ /gateway/billing/$1 break;
    proxy_pass http://$gateway_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Notification service paths
location ~ ^/notification/(v3/api-docs|swagger-ui|api/) {
    set $gateway_upstream asat-gateway-service:7030;
    rewrite ^/notification/(.*)$ /gateway/notification/$1 break;
    proxy_pass http://$gateway_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# phishing service paths
location ~ ^/phishing/(v3/api-docs|swagger-ui|api/) {
    set $gateway_upstream asat-gateway-service:7030;
    rewrite ^/phishing/(.*)$ /gateway/phishing/$1 break;
    proxy_pass http://$gateway_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# breach service paths
location ~ ^/breach/(v3/api-docs|swagger-ui|api/) {
    set $gateway_upstream asat-gateway-service:7030;
    rewrite ^/breach/(.*)$ /gateway/breach/$1 break;
    proxy_pass http://$gateway_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}


# Universal service paths
location ~ ^/universal/(v3/api-docs|swagger-ui|api/) {
    set $gateway_upstream asat-gateway-service:7030;
    rewrite ^/universal/(.*)$ /gateway/universal/$1 break;
    proxy_pass http://$gateway_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
    }
}