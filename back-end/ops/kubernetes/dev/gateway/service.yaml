apiVersion: v1
kind: Service
metadata:
  name: asat-gateway-service
  namespace: dev
  annotations:
    # Per-target-group health check for this backend (overrides any Ingress-level value)
    alb.ingress.kubernetes.io/healthcheck-path: /home
    alb.ingress.kubernetes.io/healthcheck-port: traffic-port
spec:
  selector:
    app: asat-gateway
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 7030
  type: ClusterIP