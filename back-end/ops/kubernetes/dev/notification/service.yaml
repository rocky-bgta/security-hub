apiVersion: v1
kind: Service
metadata:
    name: asat-notification-service
    namespace: dev
spec:
    # This selector is crucial. It must match the 'app' label in your Deployment's pod template.
    selector:
        app: asat-notification
    ports:
        - name: http
          protocol: TCP
            # The port on the Service itself that other services in the cluster will use.
          port: 80
            # The port on the pod that the service will forward traffic to (must match containerPort).
          targetPort: 5656

