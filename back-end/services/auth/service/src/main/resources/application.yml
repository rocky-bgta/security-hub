spring:
    profiles:
        active: ${SPRING_PROFILES_ACTIVE:local}
    application:
        name: auth-service
    main:
        allow-bean-definition-overriding: true

server:
    servlet:
        context-path: /auth

springdoc:
    api-docs:
        enabled: true
    swagger-ui:
        enabled: true
        path: /swagger-ui.html
        disable-swagger-default-url: true
        default-models-expand-depth: 1
        default-model-expand-depth: 1
        default-model-rendering: example
        display-request-duration: true
        doc-expansion: none
        filter: true
        operations-sorter: alpha
        show-extensions: false
        show-common-extensions: false
        tags-sorter: alpha
        try-it-out-enabled: true

trial:
    period-days: 30

# AWS SSM Parameter Store Configuration
aws:
  access-key-id: ${AWS_ACCESS_KEY_ID:}}
  secret-access-key: ${AWS_SECRET_ACCESS_KEY:}
  ssm:
    enabled: ${AWS_SSM_ENABLED:false}
    kms-enabled: ${AWS_SSM_KMS_ENABLED:false}
    parameter-path-prefix: ${AWS_SSM_PARAMETER_PATH_PREFIX:/asat}
    kms-key-id: ${AWS_KMS_KEY_ID:}
    region: ${AWS_REGION:us-east-1}
    fail-on-error: ${AWS_SSM_FAIL_ON_ERROR:false}
  region: ${AWS_REGION:us-east-1}
