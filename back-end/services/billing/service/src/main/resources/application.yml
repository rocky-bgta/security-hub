spring:
    profiles:
        active: ${SPRING_PROFILES_ACTIVE:local}
    main:
        allow-bean-definition-overriding: true
    jackson:
        serialization:
            write-dates-as-timestamps: false
        deserialization:
            fail-on-unknown-properties: false

server:
    servlet:
        context-path: /billing
springdoc:
    api-docs:
        enabled: true
    swagger-ui:
        enabled: true
        path: /swagger-ui.html

payment:
    reconciliation:
        enabled: true
        scheduler:
            cron: "0 */30 * * * ?"
#            cron: "0 0 */2 * * ?"  # Every 2 hours at minute 0
        lookback:
            days: 1
        batch:
            size: 50

billing:
    coupon:
        # Cancels unpaid coupon invoices after Coupon.validUntil (hourly)
        expiry-cancel:
            enabled: true
            cron: "0 0 * * * ?"
    invoice:
        # Marks unpaid invoices EXPIRED after createdAt + days (hourly)
        expiry:
            enabled: true
            days: 30
            cron: "0 0 * * * ?"

internal:
    service:
        api-key: ${INTERNAL_SERVICE_API_KEY:}
        auth-enabled: true

# AWS SSM Parameter Store Configuration
aws:
  access-key-id: ${AWS_ACCESS_KEY_ID:}}
  secret-access-key: ${AWS_SECRET_ACCESS_KEY:}
  ssm:
    enabled: ${AWS_SSM_ENABLED:false}
    kms-enabled: ${AWS_SSM_KMS_ENABLED:false}
    parameter-path-prefix: ${AWS_SSM_PARAMETER_PATH_PREFIX:/asat}
    kms-key-id: ${AWS_KMS_KEY_ID:}
    region: ${AWS_REGION:us-east-1}
    fail-on-error: ${AWS_SSM_FAIL_ON_ERROR:false}
  region: ${AWS_REGION:us-east-1}