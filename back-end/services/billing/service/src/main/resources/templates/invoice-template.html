<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Invoice</title>
    <style>
        body {
            font-family: 'Times New Roman', serif;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .invoice-box {
            max-width: 800px;
            margin: auto;
            padding: 30px;
            border: 1px solid #eee;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.15);
        }
        h1 {
            text-align: center;
            color: #444;
        }
        .invoice-header, .invoice-footer {
            margin-bottom: 20px;
        }
        .invoice-details {
            margin-bottom: 40px;
        }
        .invoice-details td {
            padding: 5px 10px;
        }
        .invoice-total {
            text-align: right;
            font-size: 18px;
            margin-top: 20px;
            font-weight: bold;
        }
        .label {
            font-weight: bold;
        }
        .footer-note {
            font-size: 12px;
            color: #666;
            margin-top: 40px;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="invoice-box">
    <h1>Invoice</h1>

    <div class="invoice-header">
        <table width="100%">
            <tr>
                <td>
                    <strong>Aspire Tech</strong><br />
                    Dhaka, Bangladesh<br />
                    support@aspiretech.com
                </td>
                <td style="text-align:right">
                    <span class="label">Invoice ID:</span> {{invoiceId}}<br />
                    <span class="label">Date:</span> {{date}}
                </td>
            </tr>
        </table>
    </div>

    <div class="invoice-details">
        <table width="100%">
            <tr>
                <td class="label" width="30%">Billed To:</td>
                <td>{{clientName}}</td>
            </tr>
            <tr>
                <td class="label">Description:</td>
                <td>License/Package Subscription</td>
            </tr>
        </table>
    </div>

    <div class="invoice-total">
        Total Amount: ${{total}}
    </div>

    <div class="footer-note">
        This is a system-generated invoice. If you have any questions, please contact support.
    </div>
</div>
</body>
</html>
