spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: breach-service
  main:
    allow-bean-definition-overriding: true

server:
  servlet:
    context-path: /breach

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

# Swagger "Servers" URLs (override per profile in application-{profile}.yml)
breach:
  swagger:
    gateway-url: ${BREACH_SWAGGER_GATEWAY_URL:https://dev.aspireelearning.com/gateway/breach}
    direct-url: ${BREACH_SWAGGER_DIRECT_URL:http://localhost:6080/breach}

# AWS SSM Parameter Store Configuration
aws:
  access-key-id: ${AWS_ACCESS_KEY_ID:}}
  secret-access-key: ${AWS_SECRET_ACCESS_KEY:}
  ssm:
    enabled: ${AWS_SSM_ENABLED:true}
    kms-enabled: ${AWS_SSM_KMS_ENABLED:true}
    parameter-path-prefix: ${AWS_SSM_PARAMETER_PATH_PREFIX:/asat}
    kms-key-id: ${AWS_KMS_KEY_ID:}
    region: ${AWS_REGION:us-east-1}
    fail-on-error: ${AWS_SSM_FAIL_ON_ERROR:false}
  region: ${AWS_REGION:us-east-1}


