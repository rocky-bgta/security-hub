plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.0'
	id 'io.spring.dependency-management' version '1.1.5'
}



dependencies {
	project ":services:course:api"
	project ":services:course:core"

	implementation project.rootProject.ext.libraries.core.springBootStarter
	implementation project.rootProject.ext.libraries.core.springBootStarterWeb

	implementation project.rootProject.ext.libraries.core.springCloudConfigServer


	testImplementation project.rootProject.ext.libraries.test.springBootStarterTest
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${project.rootProject.ext.versions.core.springCloudVersion}"
	}
}
