spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  main:
    allow-bean-definition-overriding: true

server:
  servlet:
    context-path: /cms

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html


default:
  exam:
    settings:
      duration-minutes: 30
      passing-score: 70
      retake-policy: allow
      total-questions: 10
      distribution-strategy: EQUAL

topic:
  status:
    duration:
      short-threshold: 5
      long-threshold: 10
    required-questions:
      short-duration: 5
      long-duration: 10

certificate:
  expiring-threshold-days: ${CERTIFICATE_EXPIRING_THRESHOLD_DAYS:60}

# AWS SSM Parameter Store Configuration
aws:
  access-key-id: ${AWS_ACCESS_KEY_ID:}}
  secret-access-key: ${AWS_SECRET_ACCESS_KEY:}
  ssm:
    enabled: ${AWS_SSM_ENABLED:false}
    kms-enabled: ${AWS_SSM_KMS_ENABLED:false}
    parameter-path-prefix: ${AWS_SSM_PARAMETER_PATH_PREFIX:/asat}
    kms-key-id: ${AWS_KMS_KEY_ID:}
    region: ${AWS_REGION:us-east-1}
    fail-on-error: ${AWS_SSM_FAIL_ON_ERROR:false}
  region: ${AWS_REGION:us-east-1}