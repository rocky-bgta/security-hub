spring:
    profiles:
        active: ${SPRING_PROFILES_ACTIVE:local}
    main:
        allow-bean-definition-overriding: true

server:
    servlet:
        context-path: /registration

trial:
    period-days: 30

internal:
    service:
        api-key: ${INTERNAL_SERVICE_API_KEY:}

license:
    simulation-product-names:
        - Phishing Simulation
        - Smishing Simulation
        - Vishing Simulation

# AWS SSM Parameter Store Configuration
aws:
  access-key-id: ${AWS_ACCESS_KEY_ID:}}
  secret-access-key: ${AWS_SECRET_ACCESS_KEY:}
  ssm:
    enabled: ${AWS_SSM_ENABLED:false}
    kms-enabled: ${AWS_SSM_KMS_ENABLED:false}
    parameter-path-prefix: ${AWS_SSM_PARAMETER_PATH_PREFIX:/asat}
    kms-key-id: ${AWS_KMS_KEY_ID:}
    region: ${AWS_REGION:us-east-1}
    fail-on-error: ${AWS_SSM_FAIL_ON_ERROR:false}
  region: ${AWS_REGION:us-east-1}
